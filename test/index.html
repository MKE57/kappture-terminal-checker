function genEmail(v){let cfg=state.venueConfig[v.site]||{},t=state.settings.emailTemplate,lines=[t.greeting,'',t.intro,''];let fmt=(i,l)=>i.terminal+(state.settings.includeOutletInEmail?' ('+i.outlet+')':'')+' - '+l+' '+dispDate(i.dateTime);if(v.offline.length){lines.push(t.offlineHeading);v.offline.forEach(i=>lines.push(fmt(i,'offline since')));lines.push('')}if(v.sessions.length){lines.push(t.sessionHeading);v.sessions.forEach(i=>lines.push(fmt(i,'session opened')));lines.push('')}if(t.signOff)lines.push(t.signOff);return{to:(cfg.to||[]).join('; '),cc:(cfg.cc||[]).join('; '),bcc:(cfg.bcc||[]).join('; '),subject:'Kappture terminal/session checks - '+v.site,body:lines.join('\n').trimEnd()}}function mailto(e){let p=[];if(e.cc)p.push('cc='+encodeURIComponent(e.cc.replaceAll(';',',')));if(e.bcc)p.push('bcc='+encodeURIComponent(e.bcc.replaceAll(';',',')));p.push('subject='+encodeURIComponent(e.subject));p.push('body='+encodeURIComponent(e.body));return'mailto:'+encodeURIComponent(e.to.replaceAll(';',','))+'?'+p.join('&')}function sent(site){return Boolean(state.sentEmailLog[dayKey()]&&state.sentEmailLog[dayKey()][site])}function markSent(site,on){let k=dayKey();if(!state.sentEmailLog[k])state.sentEmailLog[k]={};if(on)state.sentEmailLog[k][site]=new Date().toISOString();else delete state.sentEmailLog[k][site];save();render()}function renderEmails(){refresh();let p=state.processed;if(!p){content.innerHTML='<div class="card"><h3>No emails ready</h3><p>Process Status/Session data first.</p></div>';return}let venues=Object.values(p.venues||{}).sort((a,b)=>a.site.localeCompare(b.site));content.innerHTML='<div class="grid">'+(venues.length?venues.map(v=>{let e=genEmail(v);return'<div class="card"><h3>'+esc(v.site)+' '+(sent(v.site)?'<span class="pill good">Sent</span>':'<span class="pill session">Not sent</span>')+'</h3><div class="summary">'+S('To',esc(e.to||'Not configured'))+S('CC',esc(e.cc||'None'))+S('Issues',v.offline.length+' offline · '+v.sessions.length+' sessions')+'</div><label>Subject</label><input type="text" readonly value="'+esc(e.subject)+'"><label>Email body</label><div class="email">'+esc(e.body)+'</div><div class="actions"><button class="btn" data-copy="to" data-site="'+esc(v.site)+'">Copy To</button><button class="btn" data-copy="cc" data-site="'+esc(v.site)+'">Copy CC</button><button class="btn" data-copy="subject" data-site="'+esc(v.site)+'">Copy Subject</button><button class="btn" data-copy="body" data-site="'+esc(v.site)+'">Copy Body</button><a class="btn primary" href="'+esc(mailto(e))+'">Open in Outlook</a><button class="btn good" data-sent="'+esc(v.site)+'">Mark as sent</button><button class="btn bad" data-unsent="'+esc(v.site)+'">Clear sent</button></div></div>'}).join(''):'<div class="card"><h3>No venue emails required</h3><p class="muted">No included issues were found.</p></div>')+'</div>'}async function copyText(text,label){try{await navigator.clipboard.writeText(text);toast(label||'Copied')}catch(e){let ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(label||'Copied')}}function download(name,text,type){let blob=new Blob([text],{type:type||'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}function renderHistory(){content.innerHTML='<div class="card"><h3>History</h3><p class="muted">Processed runs archived when a new run is processed, or when Reset workflow is used with Save to History.</p>'+(state.history.length?state.history.map(h=>'<details><summary><div><strong>'+fmtWeek(h.date)+'</strong><div class="muted small">Archived '+fmtIso(h.archivedAt)+' · '+esc(h.reason||'Archived')+'</div></div><span class="pill">'+Object.keys(h.reportRecord?.venueFlags||{}).length+' venues</span></summary><div class="body"><div class="summary">'+S('Status file',esc(h.statusFile||'Unknown'))+S('Session file',esc(h.sessionFile||'Unknown'))+S('Processed',fmtIso(h.processed?.processedAt))+S('Issues',((h.processed?.includedIssues||[]).length)+' included')+'</div></div></details>').join(''):'<p class="muted">No historical runs archived yet.</p>')+'</div>'}
function collectOpen(){openCards=new Set(Array.from(document.querySelectorAll('details[data-card][open]')).map(d=>d.dataset.card))}function triVenue(v){let ts=Object.values(v.outlets||{}).flatMap(o=>Object.values(o.terminals||{}));if(v.enabled===false)return'unchecked';if(!ts.length)return'checked';let n=ts.filter(t=>t.enabled!==false).length;return n===ts.length?'checked':n===0?'unchecked':'mixed'}function triOutlet(o){let ts=Object.values(o.terminals||{});if(o.enabled===false)return'unchecked';if(!ts.length)return'checked';let n=ts.filter(t=>t.enabled!==false).length;return n===ts.length?'checked':n===0?'unchecked':'mixed'}function renderVenues(){let vs=Object.values(state.venueConfig||{}).sort((a,b)=>a.site.localeCompare(b.site));content.innerHTML='<div class="card"><h3>Venue Management</h3><p class="muted">Changes here now recalculate Review and Reporting for the current processed run.</p><div class="actions"><button class="btn" data-action="export-config">Export config JSON</button><label class="btn">Import config JSON<input type="file" accept="application/json,.json" data-import-config></label></div><div class="grid" style="margin-top:14px">'+(vs.length?vs.map(venueCfg).join(''):'<p class="muted">No venues loaded yet. Upload and process CSV files to build the venue list.</p>')+'</div></div>';document.querySelectorAll('.tri').forEach(cb=>cb.indeterminate=cb.dataset.state==='mixed')}function venueCfg(v){let outs=Object.values(v.outlets||{}).sort((a,b)=>a.outlet.localeCompare(b.outlet)),open=openCards.has(v.site)?' open':'';return'<details data-card="'+esc(v.site)+'"'+open+'><summary><div><strong>'+esc(v.site)+'</strong><div class="muted small">'+outs.length+' outlet(s)</div></div><span class="pill '+(v.enabled?'good':'offline')+'">'+(triVenue(v)==='mixed'?'Partially included':v.enabled?'Included':'Excluded')+'</span></summary><div class="body"><label>To addresses ; separated</label><input type="text" value="'+esc((v.to||[]).join('; '))+'" data-contact="to" data-site="'+esc(v.site)+'"><label>CC addresses ; separated</label><input type="text" value="'+esc((v.cc||[]).join('; '))+'" data-contact="cc" data-site="'+esc(v.site)+'"><label>BCC addresses ; separated</label><input type="text" value="'+esc((v.bcc||[]).join('; '))+'" data-contact="bcc" data-site="'+esc(v.site)+'"><label>Notes</label><textarea data-notes data-site="'+esc(v.site)+'">'+esc(v.notes||'')+'</textarea><div><div class="tree-row"><input class="tri" type="checkbox" data-state="'+triVenue(v)+'" data-enable-venue="'+esc(v.site)+'" '+(v.enabled?'checked':'')+'><strong>'+esc(v.site)+'</strong></div>'+outs.map(o=>outletCfg(v.site,o)).join('')+'</div></div></details>'}function outletCfg(site,o){let ts=Object.values(o.terminals||{}).sort((a,b)=>a.terminal.localeCompare(b.terminal,'en-GB',{numeric:true}));return'<div><div class="tree-row indent1"><input class="tri" type="checkbox" data-state="'+triOutlet(o)+'" data-enable-outlet="'+esc(site)+'|'+esc(o.outlet)+'" '+(o.enabled?'checked':'')+'><strong>'+esc(o.outlet)+'</strong></div>'+ts.map(t=>'<div class="tree-row indent2"><input class="tri" type="checkbox" data-state="'+(t.enabled?'checked':'unchecked')+'" data-enable-terminal="'+esc(site)+'|'+esc(o.outlet)+'|'+esc(t.terminal)+'" '+(t.enabled?'checked':'')+'><span>'+esc(t.terminal)+'</span></div>').join('')+'</div>'}function splitAddrs(v){return String(v||'').split(/[;,]/).map(x=>x.trim()).filter(Boolean)}function renderSettings(){let t=state.settings.emailTemplate;content.innerHTML='<div class="grid"><div class="card"><h3>Included Status Platforms</h3><p class="muted">Only disconnected devices on these platforms are treated as actionable fixed-terminal offline issues.</p><textarea id="platformList">'+esc(state.settings.allowedPlatforms.join('\n'))+'</textarea><div class="actions"><button class="btn" data-action="save-platforms">Save platforms</button><button class="btn" data-action="reset-platforms">Reset defaults</button></div></div><div class="card"><h3>Email Template</h3><label>Greeting</label><input id="tmplGreeting" type="text" value="'+esc(t.greeting)+'"><label>Intro paragraph</label><textarea id="tmplIntro">'+esc(t.intro)+'</textarea><label>Offline heading</label><input id="tmplOffline" type="text" value="'+esc(t.offlineHeading)+'"><label>Open session heading</label><input id="tmplSession" type="text" value="'+esc(t.sessionHeading)+'"><label>Optional sign-off</label><textarea id="tmplSignOff">'+esc(t.signOff)+'</textarea><div class="actions"><button class="btn" data-action="save-template">Save template</button><button class="btn" data-action="reset-template">Reset template</button></div></div><div class="card"><h3>Data controls</h3><div class="actions"><button class="btn" data-action="export-config">Export configuration JSON</button><label class="btn">Import configuration JSON<input type="file" accept="application/json,.json" data-import-config></label><button class="btn warn" data-action="clear-imports">Clear imports</button><button class="btn bad" data-action="clear-all">Clear all saved data</button></div></div></div>'}
function show(page){scrolls[current]=window.scrollY;current=page;PAGES.forEach(p=>{let b=document.querySelector('[data-page="'+p[0]+'"]');if(b)b.classList.toggle('active',p[0]===page)});let p=PAGES.find(x=>x[0]===page);title.textContent=p[1];sub.textContent=p[2];render();setTimeout(()=>window.scrollTo(0,scrolls[page]||0),0)}function render(){if(current==='home')renderHome();if(current==='status')renderImport('status');if(current==='session')renderImport('session');if(current==='review')renderReview();if(current==='emails')renderEmails();if(current==='reporting')renderReporting();if(current==='history')renderHistory();if(current==='venues')renderVenues();if(current==='settings')renderSettings()}function tick(){let n=new Date();time.textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(n);date.textContent=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(n)}
nav.innerHTML=PAGES.map(p=>'<button data-page="'+p[0]+'">'+p[1]+'</button>').join('');modal.addEventListener('click',e=>{let a=e.target.dataset.modal;if(!a)return;if(a==='cancel'){modal.classList.remove('show');pending=null}if(a==='confirm'&&pending?.type==='wrong'){let p=pending;loadImport(p.actualKind,p.file,p.raw,p.headers,p.rows);modal.classList.remove('show');pending=null;render();toast(cleanName(p.file)+' imported to Terminal '+(p.actualKind==='status'?'Status':'Session')+' successfully')}if(a==='reset-save'){modal.classList.remove('show');pending=null;reset(true)}if(a==='reset-nosave'){modal.classList.remove('show');pending=null;reset(false)}});document.addEventListener('click',e=>{let n=e.target.closest('[data-page],[data-nav]');if(n){show(n.dataset.page||n.dataset.nav);return}let clear=e.target.closest('[data-clear-import]');if(clear&&!clear.disabled){let k=clear.dataset.clearImport;state[k+'Import']=null;state.processed=null;state.currentRun=null;state.uploadStatus[k]={kind:'none',message:STATUS.none};save();render();return}let a=e.target.closest('[data-action]');if(a){let x=a.dataset.action;if(x==='process'&&!state.processed)processData();if(x==='reset-workflow'){mtitle.textContent='Reset current workflow?';mtext.textContent='This will clear uploaded files, Review results and generated emails for the current workflow. Venue Management, Settings, Reporting records and History will not be deleted.';mfile.textContent=state.processed?'A current processed run exists. Choose whether to save it to History before resetting.':'No processed run exists. Resetting will clear uploads only.';mactions.innerHTML='<button class="btn" data-modal="cancel">Cancel</button><button class="btn warn" data-modal="reset-nosave">Reset without Saving</button><button class="btn primary" data-modal="reset-save">Save to History and Reset</button>';modal.classList.add('show');return}if(x==='copy-live-report')copyLiveReport();if(x==='export-daily-report')exportDailyReport();if(x==='export-weekly-report')exportWeeklyReport();if(x==='export-ongoing-report')exportOngoingReport();if(x==='export-config')download('kappture-tool-config-'+dayKey()+'.json',JSON.stringify({venueConfig:state.venueConfig,settings:state.settings},null,2),'application/json');if(x==='save-platforms'){state.settings.allowedPlatforms=platformList.value.split(/\n/).map(norm).filter(Boolean);state.processed=null;save();toast('Platforms saved. Re-process data to apply changes.');render()}if(x==='reset-platforms'){state.settings.allowedPlatforms=[...FIXED];state.processed=null;save();render()}if(x==='save-template'){state.settings.emailTemplate={greeting:tmplGreeting.value,intro:tmplIntro.value,offlineHeading:tmplOffline.value,sessionHeading:tmplSession.value,signOff:tmplSignOff.value};save();toast('Template saved')}if(x==='reset-template'){state.settings.emailTemplate={...TEMPLATE};save();render()}if(x==='clear-imports'){state.statusImport=null;state.sessionImport=null;state.processed=null;state.currentRun=null;state.uploadStatus.status={kind:'none',message:STATUS.none};state.uploadStatus.session={kind:'none',message:STATUS.none};save();render()}if(x==='clear-all'&&confirm('Clear all saved Kappture tool data in this browser?')){state=def();save();render()}return}let ign=e.target.closest('[data-ignore]');if(ign){ignore(ign.dataset.ignore,true);return}let inc=e.target.closest('[data-include]');if(inc){includeAgain(inc.dataset.include,inc);return}let se=e.target.closest('[data-sent]');if(se){markSent(se.dataset.sent,true);return}let un=e.target.closest('[data-unsent]');if(un){markSent(un.dataset.unsent,false);return}let cp=e.target.closest('[data-copy]');if(cp){let v=state.processed&&state.processed.venues[cp.dataset.site];if(v){let em=genEmail(v);copyText(em[cp.dataset.copy]||'',cp.dataset.copy+' copied')}}});document.addEventListener('toggle',e=>{if(e.target.matches('details[data-card]')){if(e.target.open)openCards.add(e.target.dataset.card);else openCards.delete(e.target.dataset.card)}},true);document.addEventListener('change',e=>{if(e.target.matches('[data-file-kind]'))upload(e.target.dataset.fileKind,e.target.files[0]);if(e.target.matches('[data-week-select]')){state.reportingWeek=e.target.value;save();render()}if(e.target.matches('[data-day-select]')){state.reportingDay=e.target.value;save();render()}if(e.target.matches('[data-report-override]')){let [date,site,type]=e.target.dataset.reportOverride.split('|'),rec=state.reportRecords[date];if(rec&&rec.venueFlags[site]){let f=rec.venueFlags[site],overrideKey=type==='offline'?'offlineOverride':'sessionsOverride',calcKey=type==='offline'?'offlineCalc':'sessionsCalc';f[overrideKey]=(e.target.checked===!!f[calcKey])?null:e.target.checked;save();render()}}if(e.target.matches('[data-contact]')){state.venueConfig[e.target.dataset.site][e.target.dataset.contact]=splitAddrs(e.target.value);save()}if(e.target.matches('[data-notes]')){state.venueConfig[e.target.dataset.site].notes=e.target.value;save()}if(e.target.matches('[data-enable-venue]')){collectOpen();let site=e.target.dataset.enableVenue,on=e.target.checked,v=state.venueConfig[site];v.enabled=on;Object.values(v.outlets||{}).forEach(o=>{o.enabled=on;Object.values(o.terminals||{}).forEach(t=>t.enabled=on)});refresh();render()}if(e.target.matches('[data-enable-outlet]')){collectOpen();let p=e.target.dataset.enableOutlet.split('|'),o=state.venueConfig[p[0]].outlets[p[1]],on=e.target.checked;o.enabled=on;Object.values(o.terminals||{}).forEach(t=>t.enabled=on);refresh();render()}if(e.target.matches('[data-enable-terminal]')){collectOpen();let p=e.target.dataset.enableTerminal.split('|');state.venueConfig[p[0]].outlets[p[1]].terminals[p[2]].enabled=e.target.checked;refresh();render()}if(e.target.matches('[data-import-config]')){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let data=JSON.parse(rd.result);if(data.venueConfig)state.venueConfig=data.venueConfig;if(data.settings)state.settings=merge(state.settings,data.settin })();</script></body></html>
