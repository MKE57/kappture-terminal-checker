/* Venue Management hierarchy guide lines - SVG overlay version
   Lines are calculated from actual checkbox positions after render.
   Shared stems are drawn once to avoid brighter/thicker overlapping lines. */
.vm-tree {
  position: relative;
}

.vm-tree-lines {
  position: absolute;
  inset: 0;
  overflow: visible;
  pointer-events: none;
  z-index: 0;
}

.vm-tree-lines path {
  fill: none;
  stroke: rgba(255, 255, 255, 0.18);
  stroke-width: 1;
  shape-rendering: crispEdges;
}

.vm-tree .tree-row {
  position: relative;
  z-index: 1;
}

/* Disable CSS-only connector attempts so the SVG is the single source of truth */
.vm-children::before,
.vm-children::after,
.vm-terminal-list::before,
.vm-terminal-list::after,
.tree-row.indent1::before,
.tree-row.indent1::after,
.tree-row.indent2::before,
.tree-row.indent2::after {
  content: none !important;
  display: none !important;
}

function drawVenueHierarchyLines(){
  document.querySelectorAll('details[data-card][open] .vm-tree').forEach(tree=>{
    const svg=tree.querySelector(':scope > .vm-tree-lines');
    if(!svg)return;
    const rootBox=tree.getBoundingClientRect();
    const width=Math.max(1,tree.scrollWidth),height=Math.max(1,tree.scrollHeight);
    svg.setAttribute('width',width);
    svg.setAttribute('height',height);
    svg.setAttribute('viewBox','0 0 '+width+' '+height);
    svg.innerHTML='';

    const pos=cb=>{
      const r=cb.getBoundingClientRect();
      return{
        x:Math.round(r.left-rootBox.left+r.width/2),
        xLeft:Math.round(r.left-rootBox.left),
        y:Math.round(r.top-rootBox.top+r.height/2),
        yBottom:Math.round(r.bottom-rootBox.top)
      };
    };

    const drawGroup=(parentPos,childCbs)=>{
      const children=childCbs.map(pos);
      if(!children.length)return;
      const d=[];
      const trunkBottom=children[children.length-1].y;
      if(trunkBottom>parentPos.yBottom){
        d.push('M '+parentPos.x+' '+parentPos.yBottom+' V '+trunkBottom);
      }
      children.forEach(child=>{
        d.push('M '+parentPos.x+' '+child.y+' H '+child.xLeft);
      });
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',d.join(' '));
      svg.appendChild(path);
    };

    const siteCb=tree.querySelector(':scope > .tree-row > input.tri');
    if(!siteCb)return;
    const outletBlocks=Array.from(tree.querySelectorAll(':scope > .vm-children > .vm-outlet-block'));
    const outletCbs=outletBlocks.map(block=>block.querySelector(':scope > .tree-row.indent1 > input.tri')).filter(Boolean);
    drawGroup(pos(siteCb),outletCbs);

    outletBlocks.forEach(block=>{
      const outletCb=block.querySelector(':scope > .tree-row.indent1 > input.tri');
      if(!outletCb)return;
      const termCbs=Array.from(block.querySelectorAll(':scope > .vm-terminal-list > .tree-row.indent2 > input.tri'));
      drawGroup(pos(outletCb),termCbs);
    });
  });
}
